<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lua Visual Error Detector</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Noto Sans Thai", sans-serif;
        }

        .code-font {
            font-family: "JetBrains Mono", monospace;
        }

        /* เส้นหยักสีแดง */
        .error-underline {
            text-decoration-line: underline;
            text-decoration-style: wavy;
            text-decoration-color: #ef4444;
            text-decoration-thickness: 2px;
            animation: pulseError 1.5s infinite;
        }

        @keyframes pulseError {
            0%,
            100% {
                text-decoration-color: #ef4444;
            }

            50% {
                text-decoration-color: #fca5a5;
            }
        }

        /* Editor */
        .editor-wrapper {
            position: relative;
            overflow: hidden;
        }

        #backdropOverlay,
        #luaEditor {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            outline: none;

            font-family: "JetBrains Mono", monospace;
            font-size: 14px;
            line-height: 1.625rem;

            white-space: pre-wrap;
            overflow: auto;
            word-break: break-all;
        }

        #backdropOverlay {
            z-index: 1;
            color: #34d399;
            pointer-events: none;
        }

        #luaEditor {
            z-index: 2;
            color: #34d399;
            background: transparent;
            caret-color: white;
            resize: none;
        }

        #luaEditor::selection {
            background: rgba(59, 130, 246, 0.35);
        }

        #luaEditor::placeholder {
            color: #475569;
            opacity: 1;
        }

        /* Scrollbar */
        #luaEditor::-webkit-scrollbar,
        #backdropOverlay::-webkit-scrollbar,
        #terminal::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        #luaEditor::-webkit-scrollbar-track,
        #backdropOverlay::-webkit-scrollbar-track,
        #terminal::-webkit-scrollbar-track {
            background: #0f172a;
        }

        #luaEditor::-webkit-scrollbar-thumb,
        #backdropOverlay::-webkit-scrollbar-thumb,
        #terminal::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }

        #luaEditor::-webkit-scrollbar-thumb:hover,
        #backdropOverlay::-webkit-scrollbar-thumb:hover,
        #terminal::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Scan animation */
        .scanning {
            animation: scanning 0.8s ease-in-out infinite alternate;
        }

        @keyframes scanning {
            from {
                opacity: 0.55;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

                        <span class="w-3 h-3 rounded-full bg-yellow-500"></span>

                >-- สแตนด์บายรอการตรวจสอบ...

    <!-- Footer -->
    <footer

    <!-- JavaScript -->
    <script>

        const editor = document.getElementById("luaEditor");
        const backdrop = document.getElementById("backdropOverlay");
        const terminal = document.getElementById("terminal");
        const lineNumbers = document.getElementById("lineNumbers");
        const scanButton = document.getElementById("scanButton");


        /* ----------------------------------
           Escape HTML
        ---------------------------------- */

        function escapeHTML(value) {
            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* ----------------------------------
           Line Numbers
        ---------------------------------- */

        function updateLineNumbers() {

            const lineCount = editor.value.split("\n").length;

            let html = "";

            for (let i = 1; i <= lineCount; i++) {
                html += i + "<br>";
            }

            lineNumbers.innerHTML = html;
        }


        /* ----------------------------------
           Sync Editor + Backdrop
        ---------------------------------- */

        function syncBackdrop() {

            updateLineNumbers();

            backdrop.scrollTop = editor.scrollTop;
            backdrop.scrollLeft = editor.scrollLeft;

            if (!editor.value) {
                backdrop.innerHTML = "";
                return;
            }

            /*
             * หากยังไม่ได้ Scan
             * แสดงข้อความปกติ
             */
            if (!backdrop.dataset.scanned) {
                backdrop.innerHTML = escapeHTML(editor.value);
            }
        }


        editor.addEventListener("scroll", function () {

            backdrop.scrollTop = editor.scrollTop;
            backdrop.scrollLeft = editor.scrollLeft;

            lineNumbers.scrollTop = editor.scrollTop;

        });


        /* ----------------------------------
           Highlight Error
        ---------------------------------- */

        function highlightErrors(text, errors) {

            let lines = text.split("\n");

            errors.forEach(error => {

                const index = error.line - 1;

                if (index >= 0 && index < lines.length) {

                    const escaped = escapeHTML(lines[index]);

                    lines[index] =
                        "<span class='error-underline'>" +
                        escaped +
                        "</span>";

                }

            });

            return lines.join("\n");
        }


        /* ----------------------------------
           Lua Error Scanner
        ---------------------------------- */

        function analyzeLua(text) {

            const errors = [];
            const lines = text.split("\n");

            let openBlocks = 0;

            let parenOpen = 0;
            let parenClose = 0;

            let bracketOpen = 0;
            let bracketClose = 0;

            lines.forEach((line, index) => {

                const lineNumber = index + 1;

                const trimmed = line.trim();

                if (!trimmed) {
                    return;
                }


                /* --------------------------
                   != ไม่ใช่ operator ของ Lua
                -------------------------- */

                if (line.includes("!=")) {

                    errors.push({
                        line: lineNumber,
                        message:
                            "พบ != ซึ่งไม่ใช่ตัวเปรียบเทียบแบบ Lua — ใช้ ~= แทน"
                    });

                }


                /* --------------------------
                   Parentheses
                -------------------------- */

                parenOpen += (line.match(/\(/g) || []).length;
                parenClose += (line.match(/\)/g) || []).length;


                /* --------------------------
                   Brackets
                -------------------------- */

                bracketOpen += (line.match(/\[/g) || []).length;
                bracketClose += (line.match(/\]/g) || []).length;


                /* --------------------------
                   Block Open
                -------------------------- */

                const functionMatches =
                    line.match(/\bfunction\b/g) || [];

                const ifMatches =
                    line.match(/\bif\b.*\bthen\b/g) || [];

                const forMatches =
                    line.match(/\bfor\b.*\bdo\b/g) || [];

                const whileMatches =
                    line.match(/\bwhile\b.*\bdo\b/g) || [];

                const repeatMatches =
                    line.match(/\brepeat\b/g) || [];


                openBlocks += functionMatches.length;
                openBlocks += ifMatches.length;
                openBlocks += forMatches.length;
                openBlocks += whileMatches.length;
                openBlocks += repeatMatches.length;


                /* --------------------------
                   elseif / else
                   ไม่เปิด block ใหม่
                -------------------------- */


                /* --------------------------
                   End
                -------------------------- */

                const endMatches =
                    line.match(/\bend\b/g) || [];

                openBlocks -= endMatches.length;


                if (openBlocks < 0) {

                    errors.push({
                        line: lineNumber,
                        message:
                            "พบ end มากเกินไป หรือมี end ที่ไม่มี block รองรับ"
                    });

                    openBlocks = 0;
                }


                /* --------------------------
                   print(
                   -------------------------- */

                if (line.includes("print(")) {

                    const opens =
                        (line.match(/\(/g) || []).length;

                    const closes =
                        (line.match(/\)/g) || []).length;

                    if (closes < opens) {

                        errors.push({
                            line: lineNumber,
                            message:
                                "วงเล็บของ print() เปิด/ปิดไม่ครบ"
                        });

                    }
                }

            });


            /* --------------------------
               Global Parentheses
            -------------------------- */

            if (parenOpen !== parenClose) {

                errors.push({
                    line: lines.length,
                    message:
                        "จำนวนวงเล็บ ( ) ไม่สมดุล"
                });

            }


            /* --------------------------
               Global Brackets
            -------------------------- */

            if (bracketOpen !== bracketClose) {

                errors.push({
                    line: lines.length,
                    message:
                        "จำนวนวงเล็บ [ ] ไม่สมดุล"
                });

            }


            /* --------------------------
               Missing end
            -------------------------- */

            if (openBlocks > 0) {

                errors.push({
                    line: lines.length,
                    message:
                        "ตรวจพบ block ที่ยังไม่มี end ปิด"
                });

            }


            return errors;
        }


        /* ----------------------------------
           Main Scan
        ---------------------------------- */

        function checkLuaErrors() {

            const text = editor.value;

            backdrop.dataset.scanned = "true";

            if (!text.trim()) {

                terminal.innerHTML =
                    "[Warning] ไม่มีโค้ดให้ตรวจสอบ";

                backdrop.innerHTML = "";

                return;
            }


            scanButton.disabled = true;

            scanButton.classList.add("scanning");

            scanButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';


            terminal.innerHTML =
                "กำลังวิเคราะห์โครงสร้าง Lua...\n";


            setTimeout(() => {

                const errors = analyzeLua(text);


                if (errors.length > 0) {

                    const highlighted =
                        highlightErrors(text, errors);

                    backdrop.innerHTML = highlighted;


                    terminal.innerHTML =
                        "[Error] ตรวจพบปัญหา " +
                        errors.length +
                        " จุด\n\n";


                    errors.forEach((error, index) => {

                        terminal.innerHTML +=
                            `${index + 1}. Line ${error.line}: ${error.message}\n`;

                    });


                    terminal.innerHTML +=
                        "\n💥 [Failed] กรุณาตรวจสอบบรรทัดที่มีเส้นหยักสีแดง";


                } else {

                    backdrop.innerHTML =
                        escapeHTML(text);

                    terminal.innerHTML =
                        "✨ [Passed] ไม่พบข้อผิดพลาดจากการตรวจสอบพื้นฐาน\n\n" +
                        "✓ โครงสร้างวงเล็บถูกต้อง\n" +
                        "✓ ไม่พบเครื่องหมาย !=\n" +
                        "✓ ตรวจสอบ block end แล้ว";

                }


                scanButton.disabled = false;

                scanButton.classList.remove("scanning");

                scanButton.innerHTML =
                    '<i class="fa-solid fa-magnifying-glass"></i> ตรวจสอบโค้ด';

            }, 350);
        }


        /* ----------------------------------
           Quick Tools
        ---------------------------------- */

        function triggerTool(toolType) {

            switch (toolType) {

                case "syntax":

                    checkLuaErrors();

                    break;


                case "format":

                    if (!editor.value.trim()) {

                        terminal.innerHTML =
                            "[Warning] ไม่มีโค้ดสำหรับจัดรูปแบบ";

                        return;
                    }


                    const lines =
                        editor.value
                            .split("\n")
                            .map(line => line.trimEnd());


                    editor.value =
                        lines.join("\n");


                    backdrop.dataset.scanned = "";

                    syncBackdrop();


                    terminal.innerHTML =
                        "[Format] จัดรูปแบบช่องว่างท้ายบรรทัดเรียบร้อยแล้ว";

                    break;


                case "autofix":

                    autoFixLua();

                    break;


                case "snippet":

                    editor.value =
`-- ตัวอย่าง Lua ที่มี Error

local hp = 50

if hp != 0 then
    print(hp)
end`;

                    backdrop.dataset.scanned = "";

                    syncBackdrop();


                    terminal.innerHTML =
                        "[Snippet] โหลดตัวอย่างเรียบร้อย\n" +
                        "พบการใช้ != ซึ่งจงใจใส่ไว้เพื่อทดสอบ Error\n\n" +
                        "กด Scan Error เพื่อตรวจสอบ";


                    break;


                case "optimize":

                    terminal.innerHTML =
                        "[Optimize]\n\n" +
                        "คำแนะนำ:\n" +
                        "• ใช้ local กับตัวแปรที่ไม่จำเป็นต้องเป็น global\n" +
                        "• ลดการค้นหาค่าใน table ซ้ำ ๆ\n" +
                        "• แยกฟังก์ชันขนาดใหญ่เป็นฟังก์ชันย่อย\n" +
                        "• หลีกเลี่ยง loop ที่ทำงานซ้ำโดยไม่จำเป็น";


                    break;


                case "clear":

                    editor.value = "";

                    backdrop.innerHTML = "";

                    backdrop.dataset.scanned = "";

                    terminal.innerHTML =
                        "-- ล้างข้อมูลใน Editor เรียบร้อยแล้ว";


                    updateLineNumbers();

                    break;

            }
        }


        /* ----------------------------------
           Auto Fix
        ---------------------------------- */

        function autoFixLua() {

            let text = editor.value;

            if (!text.trim()) {

                text =
`function test()
    print("Hello Lua")
end`;

            } else {

                /*
                 * แก้ != เป็น ~=
                 */
                text =
                    text.replace(/!=/g, "~=");


                /*
                 * ถ้าเป็นตัวอย่าง print
                 * เติม ) แบบง่าย ๆ
                 */
                const lines = text.split("\n");

                text = lines.map(line => {

                    const trimmed = line.trim();

                    if (
                        trimmed.startsWith("print(") &&
                        !trimmed.endsWith(")")
                    ) {
                        return line + ")";
                    }

                    return line;

                }).join("\n");

            }


            editor.value = text;

            backdrop.dataset.scanned = "";

            syncBackdrop();


            terminal.innerHTML =
                "[Auto-Fix] แก้ไขเบื้องต้นเรียบร้อยแล้ว\n\n" +
                "✓ เปลี่ยน != → ~=\n" +
                "✓ ตรวจสอบวงเล็บ print()\n\n" +
                "กำลังตรวจสอบผลลัพธ์...";


            setTimeout(() => {

                checkLuaErrors();

            }, 300);

        }


        /* ----------------------------------
           Keyboard Shortcut
        ---------------------------------- */

        editor.addEventListener("keydown", function(event) {

            /*
             * Tab
             */
            if (event.key === "Tab") {

                event.preventDefault();

                const start = editor.selectionStart;
                const end = editor.selectionEnd;

                editor.value =
                    editor.value.substring(0, start) +
                    "    " +
                    editor.value.substring(end);

                editor.selectionStart =
                    editor.selectionEnd =
                    start + 4;

                syncBackdrop();

            }


            /*
             * Ctrl + Enter
             * Scan
             */
            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                checkLuaErrors();

            }

        });


        /* ----------------------------------
